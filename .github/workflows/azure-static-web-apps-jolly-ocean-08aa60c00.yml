name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
       id-token: write
       contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      # 1. Setup Node.js with pnpm caching
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 2. Install dependencies and build the Next.js app
      - name: Install dependencies
        run: npm install

      - name: Build Project
        run: npm run build

      # 3. Handle OIDC (Keeping your existing logic)
      - name: Install OIDC Client
        run: npm install @actions/core@1.6.0 @actions/http-client --legacy-peer-deps

      - name: Get Id Token
        uses: actions/github-script@v6
        id: idtoken
        with:
           script: |
               const coredemo = require('@actions/core')
               return await coredemo.getIDToken()
           result-encoding: string

      # 5. Deploy the pre-built "out" folder to Azure
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DELIGHTFUL_TREE_090A6250F }}
          action: "upload"
          app_location: "dist" 
          api_location: "api" 
          output_location: "" # This matches your Next.js export directory
          github_id_token: ${{ steps.idtoken.outputs.result }}
          skip_app_build: true # CRITICAL: This prevents Azure from running its own npm install

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: "close"
